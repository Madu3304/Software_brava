server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # CABEÇALHOS DE SEGURANÇA HTTP
    # =========================================================================

    # Content-Security-Policy restritivo para Flutter Web
    # Permite apenas recursos da mesma origem + CDN específico do Flutter,
    # bloqueia inline scripts externos e execução de eval() (mitigação XSS).
    # flutter_secure_storage usa localStorage/sessionStorage — não precisa de
    # origens externas; somente o backend (/api/) é liberado via connect-src.
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'wasm-unsafe-eval'; "
        "style-src 'self' 'unsafe-inline'; "
        "img-src 'self' data: blob:; "
        "font-src 'self' data:; "
        "connect-src 'self'; "
        "worker-src 'self' blob:; "
        "frame-ancestors 'none'; "
        "object-src 'none'; "
        "base-uri 'self';"
        always;

    # Impede sniffing do MIME type (bloqueia ataques drive-by download)
    add_header X-Content-Type-Options "nosniff" always;

    # Bloqueia renderização dentro de <iframe> de outras origens
    add_header X-Frame-Options "DENY" always;

    # Controla quanta informação de referência é enviada em links externos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS: força HTTPS por 1 ano (ativar somente quando TLS estiver configurado)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Desativa exposição da versão do nginx em respostas de erro
    server_tokens off;

    # =========================================================================
    # COMPRESSÃO
    # =========================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # =========================================================================
    # PROXY REVERSO PARA O BACKEND (FastAPI)
    # =========================================================================
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # SWAGGER / OPENAPI — desabilitado em produção via variável de ambiente.
    # Em desenvolvimento (APP_ENV=development) essas rotas são proxiadas.
    # Em produção o FastAPI já não serve /docs e /redoc (configurado em main.py),
    # mas o nginx também bloqueia para garantia dupla.
    # =========================================================================
    location ~ ^/(docs|redoc|openapi\.json)$ {
        # Retorna 404 para não revelar a existência da documentação.
        # Em desenvolvimento, comente este bloco e use o bloco de proxy abaixo.
        return 404;

        # Bloco de proxy para desenvolvimento (comentado em produção):
        # proxy_pass http://backend:8000$request_uri;
        # proxy_set_header Host            $host;
        # proxy_set_header X-Real-IP       $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # SPA Flutter Web — roteamento client-side
    # =========================================================================
    location / {
        # Cache-Control agressivo para assets imutáveis do Flutter
        # (hashes no nome do arquivo garantem cache-busting automático)
        location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Arquivos HTML nunca cacheados (SPA precisa sempre da versão atual)
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
