services:
  db:
    image: postgres:16-alpine
    container_name: software_brava_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brava}
    ports:
      - "5432:5432"
    volumes:
      - brava_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brava}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: software_brava_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-brava}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EQUIPE_PASSWORD: ${EQUIPE_PASSWORD:-brava123}
      SEED_TROCAR_SENHA: ${SEED_TROCAR_SENHA:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000,http://127.0.0.1:8000}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-chave_secreta_docker_software_brava_samu_2026_joinville_sc}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20/minute}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        API_URL: SAME_ORIGIN
    container_name: software_brava_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  brava_pgdata:

