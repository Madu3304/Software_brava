name: CI - Software Brava SAMU

on:
  push:
    branches: [ main, Dev, DevFrontEnd ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend FastAPI (Testes e Segurança)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Lint (Ruff) e SAST (Bandit)
        run: |
          ruff check . || true
          bandit -r . -x ./venv -ll || true

      - name: Executar testes do Backend
        env:
          APP_ENV: development
          JWT_SECRET_KEY: ci-test-secret-key
          CORS_ORIGINS: http://localhost:8080
        run: python test_server.py

  frontend-ci:
    name: Frontend Flutter (Analyze e Testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática (flutter analyze)
        run: flutter analyze --no-fatal-infos || true

      - name: Executar testes unitários e de widget
        run: flutter test

