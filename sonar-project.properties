# Identificação do Projeto
sonar.projectKey=SoftwareBrava
sonar.projectName=Software_Brava
sonar.projectVersion=1.0.0

# Conexão (passe o token via variável de ambiente SONAR_TOKEN no docker run)
sonar.host.url=http://host.docker.internal:9000

# Codificação
sonar.sourceEncoding=UTF-8

# Módulos separados (necessário para o plugin Flutter localizar Frontend/pubspec.yaml)
sonar.modules=backend,frontend

# --- Módulo Backend (Python / FastAPI) ---
backend.sonar.projectBaseDir=Backend
backend.sonar.sources=.
backend.sonar.tests=tests
backend.sonar.test.inclusions=tests/**/*.py
backend.sonar.exclusions=venv/**,.venv/**,__pycache__/**,**/__pycache__/**,alembic/**,test_server.py,rotate_passwords.py,teste_query.py,coverage.xml,.coverage,**/*.db
backend.sonar.coverage.exclusions=alembic/**,tests/**,test_server.py,rotate_passwords.py,teste_query.py
backend.sonar.python.coverage.reportPaths=coverage.xml

# --- Módulo Frontend (Dart / Flutter) ---
frontend.sonar.projectBaseDir=Frontend
frontend.sonar.sources=lib
frontend.sonar.tests=test
frontend.sonar.test.inclusions=test/**/*_test.dart
frontend.sonar.exclusions=build/**,.dart_tool/**,coverage/**,flutter_analyze.txt
frontend.sonar.coverage.exclusions=test/**
frontend.sonar.dart.analyzer.mode=MANUAL
frontend.sonar.dart.analyzer.report.mode=LEGACY
frontend.sonar.dart.analyzer.report.path=flutter_analyze.txt
frontend.sonar.flutter.coverage.reportPath=coverage/lcov.info
