# Identificação do Projeto
sonar.projectKey=SoftwareBrava
sonar.projectName=Software_Brava
sonar.projectVersion=1.0.0

# Codificação
sonar.sourceEncoding=UTF-8

# Diretórios de Código-Fonte e Testes
sonar.sources=Backend,Frontend/lib
sonar.tests=Backend/tests,Frontend/test
sonar.test.inclusions=Backend/tests/**/*.py,Frontend/test/**/*_test.dart

# Arquivos e pastas a ignorar
sonar.exclusions=**/venv/**,**/.venv/**,**/__pycache__/**,**/alembic/**,Backend/test_server.py,Backend/rotate_passwords.py,Frontend/build/**,Frontend/.dart_tool/**,**/coverage/**,**/*.db,**/*.drawio,**/spec.md
sonar.coverage.exclusions=Backend/alembic/**,Backend/tests/**,Backend/test_server.py,Backend/rotate_passwords.py,Frontend/test/**

# Relatórios de Cobertura de Testes (Python XML + Dart/Flutter LCOV)
sonar.python.coverage.reportPaths=Backend/coverage.xml
sonar.dart.lcov.reportPaths=Frontend/coverage/lcov.info
