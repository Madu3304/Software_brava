server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================================
    # CABEÇALHOS DE SEGURANÇA HTTP (RNF07)
    # =========================================================================

    # Content-Security-Policy restritivo para Flutter Web
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # HSTS — ativar somente quando TLS estiver configurado no load balancer/proxy
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;

    # =========================================================================
    # COMPRESSÃO GZIP
    # =========================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # =========================================================================
    # PROXY REVERSO PARA A API FASTAPI
    # =========================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # SWAGGER / OPENAPI — bloqueado em produção (404 sem revelar existência).
    # O FastAPI também desabilita /docs e /redoc quando APP_ENV=production
    # (configurado em main.py), criando defesa em camadas.
    # Para desenvolvimento local, comente o bloco "return 404" e
    # descomente o bloco de proxy abaixo.
    # =========================================================================
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;

        # proxy_pass http://127.0.0.1:8000$request_uri;
        # proxy_set_header Host            $host;
        # proxy_set_header X-Real-IP       $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================================
    # SPA Flutter Web — roteamento client-side (Painel Administrativo e Ficha APH)
    # =========================================================================
    location / {
        location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
